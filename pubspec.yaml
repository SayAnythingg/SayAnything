# need to upgrade the audioplayers to v5.2.1

name: SayAnything
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^13.0.1
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  pinput: ^3.0.1
  fluttertoast: ^8.2.4
  flutter_bloc: ^8.1.3
  iconly: ^1.0.1
  google_fonts: ^6.1.0
  curved_navigation_bar: ^1.0.3
  font_awesome_flutter: ^10.6.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  email_validator: ^2.0.1
  string_validator: ^1.0.2
  flutter_spinkit: ^5.2.0
  loading_animation_widget: ^1.2.0+4
  flutter_riverpod: ^1.0.0
  audioplayers: ^6.0.0
  flutter_chat_types: ^3.6.2
  flutter_chat_ui: ^1.6.12
  file_picker: any
  open_filex: ^4.4.0
  permission_handler: ^8.1.6
  flutter_callkit_incoming: ^2.0.1+2
  firebase_core: ^2.25.4
  flutter_slidable: ^0.6.0
  rive: any
  mockito: ^5.0.16
  http: ^1.2.0
  animated_text_kit: ^4.2.1 
  flutter_native_splash: ^2.4.0 
  flutter_pdfview: ^1.3.2
  flutter_webview_plugin: ^0.4.0
  dio: ^5.4.3+1
  flutter_buttombar_chung: ^0.0.4
  google_generative_ai: ^0.4.2
  speech_to_text: ^6.0.0
  flutter_tts: ^4.0.2
  flutter_speed_dial: ^7.0.0
  translator: ^1.0.0
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/messages.json
    - assets/animation/cat.riv
    - assets/animation/hand.riv
    - assets/animation/2.riv
    - assets/animation/3.riv
    - assets/animation/click.riv
    - assets/animation/buttoncta.riv
    - assets/animation/setting.riv
    - assets/animation/switch.riv
    - assets/images/logo_all.png
    
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Bold.ttf
        - asset: assets/fonts/Urbanist-Medium.ttf
        - asset: assets/fonts/Urbanist-SemiBold.ttf


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#7EC4CF"
  image: "assets/images/logo_all1000.png"
  android: true
  ios: true