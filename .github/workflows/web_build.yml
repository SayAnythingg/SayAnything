name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  web:
    name: Web Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Web App
      run: flutter build web

  